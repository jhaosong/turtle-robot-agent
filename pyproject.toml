[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turtle-robot-agent"
version = "0.1.0"
description = "LangChain robot agent for TurtleBot3, ROS2, Nav2, and Gazebo"
readme = "src/robot_agent/README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["robotics", "ros2", "turtlebot3", "nav2", "langchain"]
requires-python = ">=3.10, <4"
dependencies = [
    "langchain>=1.3",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2",
    "PyYAML>=6",
    "python-dotenv>=1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]
yolo = ["ultralytics>=8.0"]

[project.urls]
Homepage = "https://github.com/jhaosong/turtle-robot-agent"
Issues = "https://github.com/jhaosong/turtle-robot-agent/issues"

[project.scripts]
robot-agent = "robot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robot_agent*"]
