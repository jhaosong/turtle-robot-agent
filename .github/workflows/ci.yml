name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-robot-agent:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install robot-agent dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run robot-agent tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/test_robot_agent -p 'test_*.py' --verbose
